version: "3.8"

services:

  frontend:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
    container_name: trace-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
      - NEXT_PUBLIC_ML_URL=http://localhost:8002
    depends_on:
      backend:
        condition: service_started
    networks:
      - trace-network

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: trace-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - ML_SERVICE_URL=http://ml-service:8002
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=forensic_password
    volumes:
      - ./BACKEND/uploads:/app/uploads
      - ./BACKEND/data:/app/data
      - ./ML:/app/ML:ro
    depends_on:
      ml-service:
        condition: service_started
      neo4j:
        condition: service_started
    networks:
      - trace-network

  ml-service:
    build:
      context: ./ML
      dockerfile: Dockerfile
    container_name: trace-ml-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - PYTHONUNBUFFERED=1
    volumes:
      - ./ML/exports:/app/exports
      - ./ML/models:/app/models
    networks:
      - trace-network

  neo4j:
    image: neo4j:5-community
    container_name: trace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/forensic_password
    volumes:
      - neo4j_data:/data
    networks:
      - trace-network

volumes:
  neo4j_data:

networks:
  trace-network:
    driver: bridge

