[project]
name = "tracegraph-ml"
version = "3.4.1"
description = "GNN-Based Time-Trust Digital Crime Reconstruction ML Layer (CPU Only)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "networkx>=3.1",
    "shap>=0.43.0",
    "rapidfuzz>=3.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

